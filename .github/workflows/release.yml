name: Release

# Creates a version tag and a GitHub release with generated release notes on
# master, then builds and publishes both Docker images for that version
# (ghcr.io/<repo>:X.Y.Z and ghcr.io/<repo>-aggregator:X.Y.Z).
#
# Two ways to release:
#   - change RELEASE_VERSION (e.g. to v0.3.0) in a pull request and merge it
#   - Actions tab → Release → Run workflow, with a version

on:
  push:
    branches: [master]
    paths: [RELEASE_VERSION]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.2.0"
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Releases are only cut from the default branch
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write   # create the tag and the release
      actions: write    # start the image build for the new tag
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TARGET: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Determine version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$(tr -d '[:space:]' < RELEASE_VERSION)"
          fi
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like v1.2.3 (got '$VERSION')"
            exit 1
          fi
          if gh release view "$VERSION" --repo "$REPO" >/dev/null 2>&1; then
            if [ "$EVENT" = "workflow_dispatch" ]; then
              echo "::error::Release $VERSION already exists"
              exit 1
            fi
            echo "::notice::Release $VERSION already exists, nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create tag and release
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --repo "$REPO" \
            --target "$TARGET" \
            --title "$VERSION" \
            --generate-notes

      # Tags created with the workflow token do not trigger other workflows
      # by themselves, so start the image build for the tag explicitly.
      - name: Build images for the release
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: gh workflow run docker-publish.yml --repo "$REPO" --ref "$VERSION"

      - name: Summary
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "## Released $VERSION"
            echo "- Release: https://github.com/$REPO/releases/tag/$VERSION"
            echo "- Image build started for $VERSION (see the 'Build and publish Docker image' workflow)"
          } >> "$GITHUB_STEP_SUMMARY"
