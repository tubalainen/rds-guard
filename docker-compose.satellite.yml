# An RDS Guard satellite on its own, reporting to an aggregator elsewhere
# (on your LAN, or someone else's over HTTPS). It has no web port: the
# aggregator shows it under Admin -> Noder.
#
#   docker compose -f docker-compose.satellite.yml up -d
#
# In .env: AGGREGATOR_URL (required), NODE_NAME, NODE_LOCATION and, for your
# own aggregator, its JOIN_KEY. Without JOIN_KEY the aggregator's owner
# approves the satellite (the code is in `docker compose logs rds-guard`).
# Several dongles: rds-data/receivers.yml (see receivers.example.yml).

services:
  rds-guard:
    image: ghcr.io/tubalainen/rds-guard:latest
    # To build locally instead of pulling, comment out 'image' and uncomment:
    # build: .
    container_name: rds-guard
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./rds-data:/data
    devices:
      - /dev/bus/usb:/dev/bus/usb
