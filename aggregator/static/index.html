<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#0B0F14">
    <title>RDS Guard Aggregator</title>
    <link rel="icon" href="/static/shared/icons/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/static/shared/icons/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="/static/shared/icons/apple-touch-icon.png">
    <script src="/static/shared/theme.js"></script>
    <link rel="stylesheet" href="/static/shared/app.css">

<body>
    <header class="top">
        <div class="top-inner">
            <a class="brand" href="#/arkiv">
                <img class="brand-mark" src="/static/shared/icons/favicon.svg" width="34" height="34" alt="">
                <span class="brand-name">RDS Guard <span class="brand-sub">Aggregator</span></span>

            <nav class="nav" id="nav" aria-label="Huvudmeny"></nav>
            <form class="top-search" id="top-search" role="search">
                <label>
                    <span class="sr-only">Sök i meddelanden</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                    <input type="search" name="q" placeholder="Sök i alla noder…" autocomplete="off">

            </form>
            <a class="top-status" id="top-status" href="#/noder"><span class="dot"></span><span>Ansluter…</span></a>
        </div>
    </header>

    <main class="main" id="view"></main>

    <footer class="foot">
        <div class="foot-inner">
            <span id="foot-version">RDS Guard Aggregator</span>
            <span id="foot-mqtt"></span>
            <span id="foot-engine"></span>
            <a href="https://github.com/tubalainen/rds-guard" target="_blank" rel="noopener noreferrer">GitHub</a>
        </div>
    </footer>

    <script src="/static/shared/vendor/wavesurfer-7.12.12.min.js"></script>
    <script src="/static/shared/rdsui.js"></script>
