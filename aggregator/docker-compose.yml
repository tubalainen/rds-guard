# RDS Guard aggregator: collects events from RDS Guard satellites.
#
#   docker compose up -d
#
# Two ports, both plain HTTP:
#   8081  ingest API for satellites. Put this one on the internet through
#         your HTTPS reverse proxy (Nginx Proxy Manager, Caddy, Traefik …)
#         or a Cloudflare Tunnel. It serves /api/v1/ingest/ and nothing else.
#   8080  web UI, read API and node admin. No login: keep it on your LAN and
#         never point a proxy or tunnel at it.

services:
  aggregator:
    image: ghcr.io/tubalainen/rds-guard-aggregator:latest
    # To build locally instead of pulling, comment out 'image' and uncomment:
    # build:
    #   context: ..
    #   dockerfile: aggregator/Dockerfile
    container_name: rds-guard-aggregator
    restart: unless-stopped
    env_file: .env
    ports:
      # Web UI + read API + node admin (LAN only). On a server with a public
      # address, set WEB_UI_BIND=127.0.0.1 and reach it over SSH/VPN instead.
      - "${WEB_UI_BIND:-0.0.0.0}:${WEB_UI_PORT:-8080}:8080"
      # Ingest API: the port your reverse proxy forwards to.
      - "${INGEST_API_BIND:-0.0.0.0}:${INGEST_API_PORT:-8081}:8081"
    volumes:
      # Database, audio and downloaded models, in a folder next to this file
      - ./aggregator-data:/data
