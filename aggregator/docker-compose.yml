# RDS Guard aggregator: collects events from RDS Guard satellites.
#
#   docker compose up -d                    # aggregator + nginx
#   docker compose --profile tunnel up -d   # … plus a Cloudflare Tunnel
#
# Only nginx's /api/v1/ingest/ is meant for the internet. The web UI (port
# 8080 by default) has no login: keep it on your LAN.

services:
  aggregator:
    image: ghcr.io/tubalainen/rds-guard-aggregator:latest
    # To build locally instead of pulling, comment out 'image' and uncomment:
    # build:
    #   context: ..
    #   dockerfile: aggregator/Dockerfile
    container_name: rds-guard-aggregator
    restart: unless-stopped
    env_file: .env
    ports:
      # Web UI + read API + node admin (LAN only). On a server with a public
      # address, set WEB_UI_BIND=127.0.0.1 and reach it over SSH/VPN instead.
      - "${WEB_UI_BIND:-0.0.0.0}:${WEB_UI_PORT:-8080}:8080"
    volumes:
      - aggregator-data:/data

  nginx:
    image: nginxinc/nginx-unprivileged:1.31-alpine
    container_name: rds-guard-aggregator-nginx
    restart: unless-stopped
    depends_on:
      - aggregator
    volumes:
      - ./nginx/ingest.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # Plain HTTP for local tests or a TLS proxy on this host. Not needed
      # with the Cloudflare Tunnel, which reaches nginx inside Docker.
      - "${NGINX_BIND:-127.0.0.1}:${NGINX_PORT:-8088}:8080"

  cloudflared:
    image: cloudflare/cloudflared:2026.11.1
    container_name: rds-guard-aggregator-tunnel
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      - nginx
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}

volumes:
  aggregator-data:
