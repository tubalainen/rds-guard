# Public entry point for RDS Guard satellites.
#
# Only the ingest API is forwarded; everything else (the web UI, the read
# API and node admin) answers 404 here and is reachable on the LAN only.

# Per-client rate limit, on top of the aggregator's per-node limit
limit_req_zone $binary_remote_addr zone=ingest_per_ip:10m rate=5r/s;

# Use the client address that Cloudflare passes on, but only when the
# request comes from a private address (the cloudflared container).
# Exposing nginx directly behind Cloudflare's proxy instead? Add Cloudflare's
# address ranges (https://www.cloudflare.com/ips/) as set_real_ip_from too.
real_ip_header CF-Connecting-IP;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    # Audio uploads are at most 8 MiB
    client_max_body_size 9m;
    client_body_timeout 30s;

    location /api/v1/ingest/ {
        limit_req zone=ingest_per_ip burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://aggregator:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Mark nginx's own answers (413, 429, 502 …) as coming from the
        # aggregator side, so satellites act on them instead of treating
        # them as an unknown proxy and retrying forever.
        proxy_hide_header X-RDS-Guard-Protocol;
        add_header X-RDS-Guard-Protocol 1 always;
    }

    location / {
        return 404;
    }
}
