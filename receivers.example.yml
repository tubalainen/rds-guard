# The satellite's receivers: one entry per RTL-SDR dongle or Airspy (Mini, R2).
# Put this file in the satellite's data folder as rds-data/receivers.yml.
# Without it, one dongle listens to FM_FREQUENCY / FM_FREQUENCIES from .env.
#
# A dongle is known by its serial number, never by its USB order. List them:
#   docker compose exec rds-guard python3 -m dongles
# Two dongles with the same serial number (00000001 is common) cannot be
# told apart: give one a new number with rtl_eeprom (the command says how).
# An Airspy's serial number is 64 bits in hex, e.g. "0x644064DC2B1C2E4F";
# its gain is the linearity gain 0-21 (or lna:/mixer:/vga: by hand), and it
# has no ppm (TCXO).
#
# Gain and ppm are found automatically for each dongle, for all its stations
# together (at the first start, when decoding drops, and with Admin ->
# Noder -> Kalibrera om). gain:/ppm: here fix them instead.

receivers:
  - serial: "00000101"            # required
    name: tak                     # optional, shown on the aggregator
    # Up to 4 stations within 2 MHz on one dongle
    frequencies: [103.5M, 102.9M]
    # gain: auto                  # default; or e.g. 28.0 (dB) to fix it
    # ppm: auto                   # default; or e.g. 12

  # - serial: "00000102"
  #   name: källare
  #   frequencies: [99.1M]
  #   gain: 19.7

  # - serial: "0x644064DC2B1C2E4F"  # an Airspy Mini or R2
  #   name: mast
  #   frequencies: [103.5M, 102.9M]
  #   gain: 10                      # linearity 0-21; or leave it out (auto)
  #   # Optional, an Airspy only: a wider capture. 10M (R2) or 6M (Mini):
  #   # up to 8 stations, 7.8 / 4.6 MHz apart (default: 2 MHz, 4 stations)
  #   sample_rate: 10M
  #   # Optional, an Airspy only: its stages by hand. All three: no gain
  #   # calibration; one or two: those fixed, the others calibrated.
  #   lna: 4                        # 0-14
  #   mixer: 3                      # 0-15
  #   vga: 9                        # 0-15
